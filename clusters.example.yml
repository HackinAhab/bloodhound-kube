# clusters.example.yml — reference config for multi-cluster collection
#
# Usage:
#   bloodhound-kube collect --clusters-config clusters.yaml
#   bloodhound-kube collect -C clusters.yaml --no-parse

# defaults: fallback values for any field not set on a cluster entry.
# Every field here is optional.
defaults:
  # scope: core | all | allowlist
  scope: core

  # Collect from all namespaces (cannot combine with namespace)
  allNamespaces: false

  # Namespace filter — comma-separated (e.g. "prod,monitoring")
  # namespace: ""

  # Strip Secret data values, keep key names
  redacted: false

  # Auto-accept CRD discovery without prompting
  acceptCRDs: false

  # Per-cluster concurrent collection workers
  concurrency: 10

  # Kubernetes list pagination limit
  paginateLimit: 100

  # Number of clusters to collect in parallel (0 => sequential).
  # Total concurrent API requests ≈ clusterConcurrency × concurrency.
  clusterConcurrency: 1

  # kubernetes | openshift | auto
  clusterType: auto

  # Inline discovery allowlist (same entry format as an allowlist file; see
  # below). Combines with discoveryAllowlist. A cluster's own list REPLACES
  # this one rather than adding to it.
  # discoveryAllowlistEntries: [cert-manager.io/*, apps/v1/deployments]

  # TLS for server+token clusters only (kubeconfig clusters use their kubeconfig).
  # caCert: PEM CA bundle used to verify the API server.
  # insecureSkipTLSVerify: true skips verification explicitly.
  # With neither set, verification is currently skipped and a warning is logged;
  # a future release will verify by default.
  # caCert: ./ca.pem
  # insecureSkipTLSVerify: false

  # Create generic nodes for resource kinds without a dedicated builder.
  # The --parse-undefined-nodes CLI flag forces this on for every cluster.
  parseUndefinedNodes: false

  # kubeconfig context to use when an entry sets no context of its own.
  # context: ""

  # Output directory for per-cluster JSONL (and .json) files.
  # Each cluster gets its own file: <name>-<timestamp>.jsonl
  outputDir: ./output

clusters:
  # Minimal entry — relies entirely on defaults and current kubeconfig context.
  - name: local

  # kubeconfig-based auth with an explicit kubeconfig path and a named context.
  # context selects which context in the kubeconfig to use (defaults to current).
  # Uses this file's authentication (including exec plugins).
  # There is no awsProfile field in this YAML. See docs/aws-profiles.md for setup commands.
  - name: prod-us-east
    kubeconfig: ~/.kube/prod-us-east
    context: prod-us-east-admin
    clusterType: kubernetes
    scope: core
    redacted: true
    paginateLimit: 250

  # Direct API access — token is read from an environment variable.
  # ${VAR} references are expanded at runtime; an unset var is an error.
  - name: staging
    server: https://k8s-staging.example.com
    token: ${STAGING_TOKEN}
    namespace: prod,monitoring
    concurrency: 20
    # Recommended: verify the API server certificate. The file must exist (checked
    # at startup; relative paths resolve from the working directory).
    # caCert: ./staging-ca.pem
    # Or opt out explicitly (exclusive with caCert):
    # insecureSkipTLSVerify: true

  # Allowlist scope — collect core resources plus those listed in a file.
  # Each line in the allowlist is a resource identifier:
  #   group/version/resource  |  group/version  |  group/resource  |  v1/resource
  - name: shared-services
    kubeconfig: ~/.kube/shared
    scope: allowlist
    discoveryAllowlist: ./allowlists/shared.txt
    acceptCRDs: true

  # Inline allowlist — no separate file needed.
  - name: platform
    kubeconfig: ~/.kube/platform
    scope: allowlist
    discoveryAllowlistEntries:
      - cert-manager.io/*
      - external-secrets.io/v1beta1/externalsecrets
    parseUndefinedNodes: true

  # Explicit output path for this cluster (overrides outputDir).
  # outputDir may also be set per cluster to override the defaults block.
  - name: dr-west
    kubeconfig: ~/.kube/dr-west
    outputFile: /var/data/dr-west.jsonl

  # Override a default bool to false explicitly.
  # Omitting a bool field inherits the default; setting it to false overrides.
  - name: dev
    kubeconfig: ~/.kube/dev
    allNamespaces: true
    redacted: false
