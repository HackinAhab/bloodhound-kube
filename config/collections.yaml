    rate_limit: 5

  - name: "serviceaccounts"
    nicknames: ["sa", "serviceaccount"]
    resource_type: "serviceaccount"
    description: "Collect Kubernetes service accounts"
    api_version: "v1"
    api_group: ""
    plural: "serviceaccounts"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  # OpenShift-specific Resources
  - name: "routes"
    nicknames: ["route"]
    resource_type: "route"
    description: "Collect OpenShift routes"
    api_version: "route.openshift.io/v1"
    api_group: "route.openshift.io"
    plural: "routes"
    namespaced: true
