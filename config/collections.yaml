# BloodHound Kubernetes Collection Configuration
# This file defines which Kubernetes resources to collect and how

version: "1.0"

metadata:
  name: "kubernetes-default-collection"
  description: "Default collection configuration for Kubernetes clusters"

# Global collection settings
settings:
  parallel_collectors: 10      # Number of concurrent collectors
  batch_size: 100            # Resources per batch
  timeout_seconds: 300       # Collection timeout
  rate_limit_per_second: 100  # API requests per second

# Namespace filtering
namespaces:
  mode: "all"  # Options: "all", "include", "exclude"
  list: []     # List of namespaces (used with include/exclude modes)
  # Examples:
  # mode: "include"
  # list: ["default", "kube-system", "production"]
  
  # mode: "exclude"
  # list: ["test", "development"]

# Resource collections
collections:
  # Storage Resources
  - name: "secrets"
    nicknames: ["sec", "secret"]
    resource_type: "secret"
    description: "Collect Kubernetes secrets"
    api_version: "v1"
    api_group: ""
    plural: "secrets"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  - name: "configmaps"
    nicknames: ["cm", "configmap"]
    resource_type: "configmap"
    description: "Collect Kubernetes configmaps"
    api_version: "v1"
    api_group: ""
    plural: "configmaps"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  # Workload Resources
  - name: "deployments"
    nicknames: ["deploy", "deployment"]
    resource_type: "deployment"
    description: "Collect Kubernetes deployments"
    api_version: "apps/v1"
    api_group: "apps"
    plural: "deployments"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  - name: "pods"
    nicknames: ["po", "pod"]
    resource_type: "pod"
    description: "Collect Kubernetes pods"
    api_version: "v1"
    api_group: ""
    plural: "pods"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 15

  - name: "daemonsets"
    nicknames: ["ds", "daemonset"]
    resource_type: "daemonset"
    description: "Collect Kubernetes daemonsets"
    api_version: "apps/v1"
    api_group: "apps"
    plural: "daemonsets"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  - name: "statefulsets"
    nicknames: ["sts", "statefulset"]
    resource_type: "statefulset"
    description: "Collect Kubernetes statefulsets"
    api_version: "apps/v1"
    api_group: "apps"
    plural: "statefulsets"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  # Networking Resources
  - name: "services"
    nicknames: ["svc", "service"]
    resource_type: "service"
    description: "Collect Kubernetes services"
    api_version: "v1"
    api_group: ""
    plural: "services"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  - name: "ingresses"
    nicknames: ["ing", "ingress"]
    resource_type: "ingress"
    description: "Collect Kubernetes ingresses"
    api_version: "networking.k8s.io/v1"
    api_group: "networking.k8s.io"
    plural: "ingresses"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  - name: "networkpolicies"
    nicknames: ["netpol", "networkpolicy"]
    resource_type: "networkpolicy"
    description: "Collect Kubernetes network policies"
    api_version: "networking.k8s.io/v1"
    api_group: "networking.k8s.io"
    plural: "networkpolicies"
    namespaced: true
    cluster_scoped: false
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 10

  # Cluster Resources
  - name: "nodes"
    nicknames: ["no", "node"]
    resource_type: "node"
    description: "Collect Kubernetes nodes"
    api_version: "v1"
    api_group: ""
    plural: "nodes"
    namespaced: false
    cluster_scoped: true
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 5

  - name: "crds"
    nicknames: ["crd"]
    resource_type: "crd"
    description: "Collect custom resource definitions"
    api_version: "apiextensions.k8s.io/v1"
    api_group: "apiextensions.k8s.io"
    plural: "customresourcedefinitions"
    namespaced: false
    cluster_scoped: true
    enabled: true
    supported_clusters: ["kubernetes", "openshift"]
    rate_limit: 5

  # RBAC Resources
  - name: "roles"
    nicknames: ["role"]
    resource_type: "role"
    description: "Collect Kubernetes roles"
    api_version: "rbac.authorization.k8s.io/v1"
    api_group: "rbac.authorization.k8s.io"
    plural: "roles"
